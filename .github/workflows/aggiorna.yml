name: Aggiorna playlist IPTV
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unisci e controlla i canali
        run: python unisci.py
      - name: Pubblica playlist e report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add italia-unificata.m3u controllo-canali.txt
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna playlist e controllo canali"
            git push
          fi
